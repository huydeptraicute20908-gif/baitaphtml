<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>1.4.1 - Chèn hình ảnh</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 24px;
      }
      .fruits-card {
        border: 1px solid #777;
        width: 300px;
        padding: 12px 16px 18px;
        background: #fff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      }
      .fruits-card h4 {
        margin: 0 0 12px 0;
        font-size: 16px;
      }
      .fruit-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .fruit-grid img {
        width: 100%;
        height: 52px;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid #eee;
      }
      .caption {
        margin-top: 8px;
        font-size: 13px;
        font-style: italic;
        color: #444;
      }
    </style>
  </head>
  <body>
    <div class="fruits-card">
      <h4>Fruits</h4>
      <div class="fruit-grid">
        <!-- Hàng 1 -->
        <img src="images/banana.png" alt="Banana" />
        <img src="images/orange.png" alt="Orange" />
        <img src="images/kiwi.png" alt="Kiwi" />
        <img src="images/apple.png" alt="Apple" />
        <!-- Hàng 2 -->
        <img src="images/apple.png" alt="Apple" />
        <img src="images/banana.png" alt="Banana" />
        <img src="images/kiwi.png" alt="Kiwi" />
        <img src="images/orange.png" alt="Orange" />
        <!-- Hàng 3 -->
        <img src="images/banana.png" alt="Banana" />
        <img src="images/orange.png" alt="Orange" />
        <img src="images/kiwi.png" alt="Kiwi" />
        <img src="images/apple.png" alt="Apple" />
      </div>
    </div>
    <p class="caption">Hình 1.12. Minh họa chèn hình ảnh</p>
  </body>
</html>
